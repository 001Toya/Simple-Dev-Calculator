<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <h1>Welcome to Dev Simple Calculator</h1>

        <form id="calculatorForm">

            <div class="inputs">
                <label for="num1">Num1</label>
                <input 
                    type="number" 
                    id="num1" 
                    name="num1" 
                    step="any" 
                    required
                >
            </div>

            <div class="inputs">
                <label for="num2">Num2</label>
                <input 
                    type="number" 
                    id="num2" 
                    name="num2" 
                    step="any" 
                    required
                >
            </div>

            <fieldset>
                <legend>Select Operation</legend>

                <button type="submit" name="operation" value="ADD">ADD</button>
                <button type="submit" name="operation" value="SUB">SUB</button>
                <button type="submit" name="operation" value="MUL">MUL</button>
                <button type="submit" name="operation" value="DIV">DIV</button>

            </fieldset>

        </form>

        <div id="resultBox" class="result-box" hidden>
            <p id="result"></p>
            <button id="backButton" class="back-btn" type="button">
                Clear
            </button>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
